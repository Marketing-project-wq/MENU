<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Katalog resep sehat 20FIT — jelajahi resep resmi & kontribusi member. Submit resepmu, direview admin sebelum tayang." />
    <!-- Terapkan tema sebelum paint (hindari kedip) -->
    <script>
      try {
        if (localStorage.getItem("menu20fit_theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Menu 20FIT — Resep Sehat</title>
    <link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Logo-20fit.png" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f0b" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- GA4 -- satu Measurement ID dipakai di semua properti *.20fit.id (20fit.id, arena.20fit.id,
         clinic.20fit.id) supaya traffic lintas subdomain (mis. lompat dari media.20fit.id ke sini)
         tetap terhitung satu user journey. cookie_domain:'auto' WAJIB -- itu yang bikin cookie GA
         ke-set di level .20fit.id, bukan cuma recipe.20fit.id. Halaman ini SPA (client-side route),
         jadi page_view untuk navigasi setelah load pertama dikirim manual dari src/router.tsx. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70JD631GZC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-70JD631GZC", { cookie_domain: "auto" });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
