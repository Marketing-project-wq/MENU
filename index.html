<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Katalog resep sehat 20FIT — jelajahi resep resmi & kontribusi member. Submit resepmu, direview admin sebelum tayang." />
    <!-- Domain resmi = recipe.20fit.id. Redirect PERMANEN dari domain lama supaya tautan lama &
         indeks pencarian tidak mati -- "menu.20fit.id" (tak pernah punya DNS, cuma dokumen lama)
         dan "recepie.20fit.id" (salah eja, domain produksi yang SEMPAT live -- lihat js/auth.js
         MENU_ORIGIN di repo PROFILE20FIT). Ini redirect sisi-klien (SPA statis, tanpa server
         custom) -- kalau memungkinkan pasang JUGA 301 asli di layer Cloudflare/DNS untuk transfer
         SEO yang lebih kuat, ini cuma jaring pengaman. Taruh SEBELUM apa pun lain di <head>.
         Cek path/query/hash ikut terbawa. -->
    <script>
      (function () {
        var OLD_HOSTS = ["menu.20fit.id", "recepie.20fit.id"];
        if (OLD_HOSTS.indexOf(location.hostname) !== -1) {
          location.replace("https://recipe.20fit.id" + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <!-- Terapkan tema sebelum paint (hindari kedip) -->
    <script>
      try {
        if (localStorage.getItem("menu20fit_theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Menu 20FIT — Resep Sehat</title>
    <link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Logo-20fit.png" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f0b" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
